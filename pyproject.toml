[tool.ruff.lint]
# Core correctness gates plus hygiene; broad exception catches (BLE001) and
# except-pass (S110) are DELIBERATE in a trading terminal: no broker/network
# hiccup may ever crash a process holding live positions.
select = ["E4", "E7", "E9", "F", "I001", "RUF022", "SIM103"]
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["alpaca.*", "websockets.*"]
ignore_missing_imports = true
no_strict_optional = true
